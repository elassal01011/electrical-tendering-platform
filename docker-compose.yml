services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tendering
      POSTGRES_PASSWORD: tendering
      POSTGRES_DB: tendering_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tendering -d tendering_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://tendering:tendering@postgres:5432/tendering_platform?schema=public"
      DIRECT_URL: "postgresql://tendering:tendering@postgres:5432/tendering_platform?schema=public"
      REDIS_URL: "redis://redis:6379"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-false}"
      MAX_EXCEL_UPLOAD_MB: "${MAX_EXCEL_UPLOAD_MB:-10}"
      NEXTAUTH_URL: "http://localhost:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
